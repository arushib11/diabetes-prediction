data:
  raw_path: data/diabetes.csv
  test_size: 0.2
  random_state: 42

mlflow:
  experiment_name: diabetes_prediction
  tracking_uri: mlruns

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: lbfgs

  random_forest:
    n_estimators: 200
    max_depth: 8
    min_samples_leaf: 4
    random_state: 42

  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
